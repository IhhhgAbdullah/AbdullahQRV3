name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'AbdullahQR_fixed*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -name 'AbdullahQR_Android*.zip' -print -quit)
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP للمشروع داخل المستودع."
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Verify Android project
        run: |
          test -f extracted/AbdullahQR/settings.gradle.kts
          test -f extracted/AbdullahQR/app/build.gradle.kts
          test -f extracted/AbdullahQR/gradle.properties
          echo "Android project found and AndroidX is enabled."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: extracted/AbdullahQR
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbdullahQR-debug-apk
          path: extracted/AbdullahQR/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
